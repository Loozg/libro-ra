<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Librerías estables -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      /* Botón de inicio para activar cámara y video en celulares */
      #botonInicio {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 10000; padding: 20px 40px; background: #FF5722;
        color: white; border: none; border-radius: 50px; font-size: 18px;
        font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>

    <button id="botonInicio">TOCA PARA COMENZAR</button>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets/targets.mind; autoStart: false; uiScanning: yes;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Tu video Esc_1.mp4 -->
        <video id="videoAnimacion" src="./videos/Esc_1.mp4" preload="auto" loop="true" muted playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Se activa con la ilustración Cuebto_1 (primer target del archivo .mind) -->
      
        <a-video src="#videoAnimacion" width="1" height="0.6" position="0 0 0"></a-video>
      
    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      const btn = document.querySelector('#botonInicio');
      const video = document.querySelector('#videoAnimacion');

      btn.addEventListener('click', () => {
        // Al hacer clic, activamos la RA y el video
        sceneEl.systems["mindar-image-system"].start();
        video.play(); 
        video.pause(); // Lo dejamos listo para cuando detecte el dibujo
        btn.style.display = 'none';
      });

      // Eventos para detectar el dibujo
      const targetEl = document.querySelector('[mindar-image-target]');
      targetEl.addEventListener("targetFound", () => {
        console.log("Ilustración encontrada");
        video.play();
      });

      targetEl.addEventListener("targetLost", () => {
        video.pause();
      });
    </script>
  </body>
</html>
