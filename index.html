<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #222; }
      #status { position: fixed; top: 10px; left: 10px; z-index: 1000; color: white; background: rgba(0,0,0,0.7); padding: 10px; font-family: sans-serif; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="status">Iniciando sistema...</div>

    <a-scene mindar-image="imageTargetSrc: ./targets/targets.mind; autoStart: true; uiLoading: no;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="vid" src="./videos/esc_1.mp4" loop="true" muted playsinline></video>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
        <a-video src="#vid" width="1" height="0.6"></a-video>
      
    </a-scene>

    <script>
      const status = document.getElementById('status');
      const sceneEl = document.querySelector('a-scene');

      // Detectar si la escena cargó
      sceneEl.addEventListener('loaded', () => {
        status.innerText = "Escena lista. Esperando cámara...";
      });

      // Detectar errores de AR
      sceneEl.addEventListener('arError', (event) => {
        status.style.background = "red";
        status.innerText = "ERROR DE CÁMARA: Revisa los permisos del navegador.";
      });

      // Detectar si encontró el dibujo
      const targetEl = document.querySelector('[mindar-image-target]');
      targetEl.addEventListener("targetFound", () => {
        status.innerText = "¡DIBUJO DETECTADO!";
        document.querySelector('#vid').play();
      });
    </script>
  </body>
</html>
